[package]
name = "pokerescue-server"
version = "0.1.0"
edition = "2021"
description = "PokéRescue Sentinel pure Rust standalone executable server"
authors = ["PokéRescue Sentinel Team"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "pokerescue-server"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
