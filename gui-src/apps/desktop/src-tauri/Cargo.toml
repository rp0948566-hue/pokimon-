[package]
name = "pokerescue-sentinel-shell"
version = "0.1.0"
description = "PokéRescue Sentinel Tauri 2 desktop shell"
edition = "2021"

[lib]
name = "pokerescue_sentinel_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
