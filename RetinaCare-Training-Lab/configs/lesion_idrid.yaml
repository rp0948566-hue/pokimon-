# Lesion segmentation (MA/HE/EX/SE) on IDRiD pixel masks; patches keep tiny-lesion resolution.
name: lesion_idrid
encoder: resnet34
pretrained: true
scale: 0.5               # image downscale before patching (1.0 keeps full resolution for MA)
patch: 512
batch_size: 4
patches_per_image: 12
pos_bias: 0.6
epochs: 30
lr: 3.0e-4
weight_decay: 1.0e-4
freeze_epochs: 0
warmup_epochs: 2
patience: 8
grad_accum: 1
amp: true
seed: 42
num_workers: 4
